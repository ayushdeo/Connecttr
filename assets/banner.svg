<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Connecttr">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#9b5cff"/>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, Menlo, Monaco, monospace; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- connection network motif -->
  <g opacity="0.6" stroke="#2b3a55" stroke-width="1.5">
    <line x1="1000" y1="90" x2="1075" y2="150"/><line x1="1075" y1="150" x2="1000" y2="215"/>
    <line x1="1075" y1="150" x2="1150" y2="95"/><line x1="1075" y1="150" x2="1150" y2="210"/>
  </g>
  <g>
    <circle cx="1000" cy="90"  r="8" fill="#58a6ff"/><circle cx="1000" cy="215" r="8" fill="#3fb950"/>
    <circle cx="1150" cy="95"  r="8" fill="#9b5cff"/><circle cx="1150" cy="210" r="8" fill="#ffa657"/>
    <circle cx="1075" cy="150" r="11" fill="#58a6ff"/>
  </g>

  <text x="64" y="110" class="sans" font-size="50" font-weight="700" fill="#e6edf3">Connecttr</text>
  <text x="66" y="152" class="mono" font-size="19" fill="#9fb0c3">Full-stack, multi-tenant SaaS that automates the entire</text>
  <text x="66" y="178" class="mono" font-size="19" fill="#9fb0c3">B2B outbound sales loop — discover → score → email → learn</text>

  <g class="mono" font-size="15" fill="#7d8590">
    <text x="66" y="232">React 19</text><text x="165" y="232" fill="#30363d">|</text>
    <text x="185" y="232">FastAPI</text><text x="280" y="232" fill="#30363d">|</text>
    <text x="300" y="232">MongoDB Atlas</text><text x="460" y="232" fill="#30363d">|</text>
    <text x="480" y="232">Perplexity Sonar</text><text x="660" y="232" fill="#30363d">|</text>
    <text x="680" y="232">Postmark</text><text x="790" y="232" fill="#30363d">|</text>
    <text x="810" y="232">Render</text>
  </g>
  <text x="66" y="274" class="mono" font-size="13" fill="#484f58">RBAC multi-tenancy · SSE streaming · adaptive scoring · github.com/ayushdeo</text>
</svg>
