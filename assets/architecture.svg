<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Connecttr architecture and pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, Menlo, Monaco, monospace; }
      .p { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.30); stroke-width:1.5; }
      .l { fill: rgba(155,92,255,0.09); stroke: rgba(155,92,255,0.34); stroke-width:1.5; }
      .t { fill:#e6edf3; } .d { fill:#8b949e; }
    </style>
  </defs>
  <rect width="1200" height="330" rx="16" fill="url(#bg)"/>
  <text x="24" y="38" class="sans" font-size="18" font-weight="700" fill="#e6edf3">Four-phase pipeline over a React 19 SPA + FastAPI + MongoDB stack</text>

  <!-- pipeline boxes -->
  <g>
    <rect class="p" x="24"  y="66" width="270" height="118" rx="12"/>
    <rect class="p" x="318" y="66" width="270" height="118" rx="12"/>
    <rect class="p" x="612" y="66" width="270" height="118" rx="12"/>
    <rect class="l" x="906" y="66" width="270" height="118" rx="12"/>
  </g>
  <g stroke="#58a6ff" stroke-width="2" marker-end="url(#arw)">
    <line x1="296" y1="125" x2="314" y2="125"/>
    <line x1="590" y1="125" x2="610" y2="125"/>
    <line x1="884" y1="125" x2="904" y2="125"/>
  </g>
  <!-- feedback arrow from learn back to score -->
  <path d="M1041 184 L1041 300 L453 300 L453 186" fill="none" stroke="#9b5cff" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="640" y="294" class="mono d" font-size="12" fill="#9b5cff">adaptive weights: engagement re-tunes scoring per org</text>

  <g>
    <text x="40" y="94" class="mono" font-size="12" fill="#58a6ff" font-weight="700">PHASE 1</text>
    <text x="40" y="120" class="sans t" font-size="15" font-weight="700">Lead discovery</text>
    <text x="40" y="144" class="mono d" font-size="12">Perplexity brief → ICP</text>
    <text x="40" y="162" class="mono d" font-size="12">Scrape.do + Jina.ai</text>
    <text x="40" y="178" class="mono d" font-size="12">enrich → MongoDB (SSE)</text>

    <text x="334" y="94" class="mono" font-size="12" fill="#58a6ff" font-weight="700">PHASE 2</text>
    <text x="334" y="120" class="sans t" font-size="15" font-weight="700">Intent scoring</text>
    <text x="334" y="144" class="mono d" font-size="12">rule 0.30 + LLM 0.50</text>
    <text x="334" y="162" class="mono d" font-size="12">+ engagement 0.20</text>
    <text x="334" y="178" class="mono d" font-size="12">→ final score 0–100</text>

    <text x="628" y="94" class="mono" font-size="12" fill="#58a6ff" font-weight="700">PHASE 3</text>
    <text x="628" y="120" class="sans t" font-size="15" font-weight="700">Email generation</text>
    <text x="628" y="144" class="mono d" font-size="12">personalized send via</text>
    <text x="628" y="162" class="mono d" font-size="12">Postmark; open/click</text>
    <text x="628" y="178" class="mono d" font-size="12">webhooks in real time</text>

    <text x="922" y="94" class="mono" font-size="12" fill="#9b5cff" font-weight="700">PHASE 4</text>
    <text x="922" y="120" class="sans t" font-size="15" font-weight="700">Health &amp; learning</text>
    <text x="922" y="144" class="mono d" font-size="12">observed vs predicted</text>
    <text x="922" y="162" class="mono d" font-size="12">conversion → re-tune</text>
    <text x="922" y="178" class="mono d" font-size="12">weights per org</text>
  </g>
</svg>
